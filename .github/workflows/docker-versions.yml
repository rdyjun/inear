name: Docker versions

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/docker-compose.yml"
      - "**/docker-compose.yaml"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose.yml"
      - "**/compose.yaml"
      - "**/compose.*.yml"
      - "**/compose.*.yaml"
      - "docs/docker-versions.md"
      - "scripts/generate-docker-versions.py"
      - ".github/workflows/docker-versions.yml"

permissions:
  contents: write

concurrency:
  group: docker-versions-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docker versions doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout same-repository head
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Checkout fork head
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the generator
        run: python3 scripts/generate-docker-versions.py --self-test

      - name: Regenerate docs/docker-versions.md
        run: |
          set +e
          python3 scripts/generate-docker-versions.py
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::Docker 이미지 태그가 정확한 버전으로 고정되지 않았거나 문서 생성에 실패했습니다. 로그의 error: 줄을 보고 태그를 MAJOR.MINOR.PATCH로 고정한 뒤, 저장소 루트에서 python3 scripts/generate-docker-versions.py 를 실행하고 docs/docker-versions.md 를 커밋하세요."
            git diff -- docs/docker-versions.md || true
            exit "$code"
          fi

      - name: Commit the document on same-repository branches
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git add -- docs/docker-versions.md
          if git diff --cached --quiet -- docs/docker-versions.md; then
            echo "docs/docker-versions.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Docker 이미지 버전 문서를 다시 생성한다"
          if git push origin "HEAD:${HEAD_REF}"; then
            echo "Pushed regenerated docs/docker-versions.md to ${HEAD_REF}."
            exit 0
          fi
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::error::docs/docker-versions.md가 Dockerfile/Compose와 달라 다시 생성했지만 Dependabot 브랜치에 푸시하지 못했습니다. Dependabot이 연 워크플로의 GITHUB_TOKEN은 쓰기가 거절될 수 있습니다. 저장소 루트에서 python3 scripts/generate-docker-versions.py 를 실행하고 docs/docker-versions.md 를 이 브랜치에 커밋하세요."
          else
            echo "::error::docs/docker-versions.md가 Dockerfile/Compose와 달라 다시 생성했지만 이 브랜치에 푸시하지 못했습니다. 브랜치 보호가 푸시를 막았거나 토큰에 contents:write 권한이 없습니다. 저장소 루트에서 python3 scripts/generate-docker-versions.py 를 실행하고 docs/docker-versions.md 를 커밋하세요."
          fi
          git show --format= -- docs/docker-versions.md || true
          exit 1

      - name: Fail when a fork document drifted
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/docker-versions.md)" ]; then
            echo "docs/docker-versions.md is already up to date."
            exit 0
          fi
          echo "::error::docs/docker-versions.md가 Dockerfile/Compose와 다릅니다. 이 풀 리퀘스트는 포크에서 왔기 때문에 워크플로가 문서를 커밋할 수 없습니다. 저장소 루트에서 python3 scripts/generate-docker-versions.py 를 실행하고 docs/docker-versions.md 를 커밋하세요."
          git diff -- docs/docker-versions.md || true
          exit 1
